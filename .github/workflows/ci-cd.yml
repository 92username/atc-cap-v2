name: CI/CD - TATIC Processor

# Trigger: Executa em push para main e pull requests / fake commit2
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Variáveis de ambiente globais
env:
  APP_NAME: tatic-processor
  APP_PORT: 8506
  REGISTRY_USER: 92username
  ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
  ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}

jobs:
  # Job de CI: Build e testes locais
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar formatação com Black
        run: |
          black --check .

      - name: Verificar código com Ruff
        run: |
          ruff check .

      - name: Executar testes com pytest
        run: |
          pip install pytest
          pytest tests/ --tb=short

  # Job de CD: Build Docker, push para GHCR e deploy via SSH
  cd:
    needs: ci  # Depende do job ci passar
    if: github.ref == 'refs/heads/main'  # Só roda na branch main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build da imagem Docker
        run: |
          # --pull força atualização da imagem base
          # --no-cache força rebuild completo de todas as camadas
          docker build --pull --no-cache \
            -t ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }} \
            -t ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:latest .

      - name: Push da imagem para GHCR
        run: |
          docker push ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}
          docker push ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:latest

      - name: Deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.1.0
        env:
          IMAGE_TAG: ${{ github.run_number }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          REGISTRY_USER: ${{ env.REGISTRY_USER }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE_TAG,GHCR_TOKEN,REGISTRY_USER
          script: |
            set -euo pipefail
            APP_DIR=/opt/atc-cap-v2
            cd "$APP_DIR"

            git fetch origin main --prune
            git checkout main 2>/dev/null || git checkout -B main origin/main
            git reset --hard origin/main
            git clean -fd

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
            IMAGE_TAG="$IMAGE_TAG" docker compose pull streamlit-app
            IMAGE_TAG="$IMAGE_TAG" docker compose up -d --no-build
            docker logout ghcr.io || true

            sleep 6
            docker compose ps
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8506/ || true)
            echo "health=$code"
            if [ "$code" != "200" ]; then
              docker compose logs --tail 30
              exit 1
            fi
