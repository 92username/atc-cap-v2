name: CI/CD - TATIC Processor

# Trigger: Executa em push para main e pull requests
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

# Variáveis de ambiente globais
env:
  APP_NAME: tatic-processor
  APP_PORT: 8506
  REGISTRY_USER: 92username

jobs:
  # Job de CI: Build e testes locais
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar formatação com Black
        run: |
          pip install black
          black --verbose .

      - name: Verificar código com Ruff
        run: |
          pip install ruff
          ruff --fix .

      - name: Executar testes com pytest
        run: |
          pip install pytest
          pytest tests/ --tb=short

  # Job de CD: Build Docker, push para GHCR e deploy via SSH
  cd:
    needs: ci  # Depende do job ci passar
    if: github.ref == 'refs/heads/main'  # Só roda na branch main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build da imagem Docker
        run: |
          # --pull força atualização da imagem base
          # --no-cache força rebuild completo de todas as camadas
          docker build --pull --no-cache -t ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }} .

      - name: Push da imagem para GHCR
        run: |
          docker push ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}

      - name: Deploy via SSH na VPS Hostinger
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            mkdir -p /root/.streamlit
            cat > /root/.streamlit/config.toml << CONFIGEOF
            [theme]
            primaryColor="#00D9FF"
            backgroundColor="#000000"
            secondaryBackgroundColor="#1A1A1A"
            textColor="#FFFFFF"
            font="sans serif"

            [client]
            showErrorDetails=true
            CONFIGEOF

            docker stop ${{ env.APP_NAME }} || true
            docker commit ${{ env.APP_NAME }} ${{ env.APP_NAME }}:backup.$(date +%s) || true
            docker rm ${{ env.APP_NAME }} || true

            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              --cpus=1.6 \
              --memory=4g \
              --memory-swap=5g \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -v /root/atc-cap-v2/uploads:/app/uploads \
              -v /root/atc-cap-v2/outputs:/app/outputs \
              -v /root/.streamlit:/app/.streamlit \
              -e STREAMLIT_BROWSER_GATHER_USAGE_STATS=false \
              -e STREAMLIT_SERVER_ENABLECORS=false \
              -e STREAMLIT_SERVER_PORT=8506 \
              -e STREAMLIT_SERVER_HEADLESS=true \
              -e STREAMLIT_SERVER_MAXUPLOADSIZE=200 \
              ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}

            sleep 5

            if docker ps | grep -q ${{ env.APP_NAME }}; then
              echo "✅ Deploy realizado com sucesso!"
              docker logs --tail 10 ${{ env.APP_NAME }}
            else
              echo "❌ Erro no deploy!"
              exit 1
            fi