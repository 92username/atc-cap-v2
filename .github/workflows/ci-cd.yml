name: CI/CD - TATIC Processor

# Trigger: Executa em push para main e pull requests / fake commit2
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read
  packages: write

# Variáveis de ambiente globais
env:
  APP_NAME: tatic-processor
  APP_PORT: 8506
  REGISTRY_USER: 92username
  ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
  ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}

jobs:
  # Job de CI: Build e testes locais
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar formatação com Black
        run: |
          black --check .

      - name: Verificar código com Ruff
        run: |
          ruff check .

      - name: Executar testes com pytest
        run: |
          pip install pytest
          pytest tests/ --tb=short

  # Job de CD: Build Docker, push para GHCR e deploy via SSH
  cd:
    needs: ci  # Depende do job ci passar
    if: github.ref == 'refs/heads/main'  # Só roda na branch main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.REGISTRY_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build da imagem Docker
        run: |
          # --pull força atualização da imagem base
          # --no-cache força rebuild completo de todas as camadas
          docker build --pull --no-cache \
            -t ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }} \
            -t ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:latest .

      - name: Push da imagem para GHCR
        run: |
          docker push ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}
          docker push ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:latest

      - name: Deploy via SSH na VPS Hostinger
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            set -e

            mkdir -p /root/atc-cap-v2/uploads /root/atc-cap-v2/outputs /root/atc-cap-v2/data/internal
            mkdir -p /root/.streamlit
            cat > /root/.streamlit/config.toml << CONFIGEOF
            [theme]
            primaryColor="#00D9FF"
            backgroundColor="#000000"
            secondaryBackgroundColor="#1A1A1A"
            textColor="#FFFFFF"
            font="sans serif"

            [client]
            showErrorDetails=true
            CONFIGEOF

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ env.REGISTRY_USER }}" --password-stdin

            docker rm -f ${{ env.APP_NAME }} || true
            docker rm -f atc-cap-v2-streamlit-app-1 || true
            docker pull ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}

            docker run -d \
              --name ${{ env.APP_NAME }} \
              --restart unless-stopped \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -v /root/atc-cap-v2/uploads:/app/uploads \
              -v /root/atc-cap-v2/outputs:/app/outputs \
              -v /root/atc-cap-v2/data/internal:/app/data/internal:ro \
              -v /root/.streamlit:/app/.streamlit \
              -e INTERNAL_TATIC_FILE=/app/data/internal/base_tatic.xlsx \
              -e STREAMLIT_BROWSER_GATHER_USAGE_STATS=false \
              -e STREAMLIT_SERVER_ENABLECORS=false \
              -e STREAMLIT_SERVER_PORT=8506 \
              -e STREAMLIT_SERVER_HEADLESS=true \
              -e STREAMLIT_SERVER_MAXUPLOADSIZE=200 \
              -e ADMIN_EMAILS="${{ env.ADMIN_EMAILS }}" \
              -e ALLOWED_EMAILS="${{ env.ALLOWED_EMAILS }}" \
              ghcr.io/${{ env.REGISTRY_USER }}/tatic-processor:${{ github.run_number }}

            sleep 5

            if docker ps --format '{{.Names}}' | grep -qx ${{ env.APP_NAME }}; then
              echo "✅ Deploy realizado com sucesso!"
              docker logs --tail 10 ${{ env.APP_NAME }}
            else
              echo "❌ Erro no deploy!"
              exit 1
            fi
