# Ruff configuration for ATC-CAP-V2
# See https://beta.ruff.rs/docs/ for more information

# General configuration
line-length = 100
target-version = "py311"  # Assuming Python 3.11 is used as in Dockerfile

# Linting specific configuration
[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "W",   # warnings
]

ignore = [
    "E501",  # line too long (handled by black)
    "E203",  # whitespace before ':' (handled by black)
]

# Exclude a variety of commonly ignored directories
exclude = [
    ".git",
    ".github",
    "__pycache__",
    ".venv",
    "venv",
    ".env",
    "env",
    "build",
    "dist",
    "node_modules",
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # Imported but unused

[lint.isort]
known-first-party = ["app", "tatic_processor"]