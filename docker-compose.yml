version: '3.8'

services:
  streamlit-app:
    build: .
    image: atc-cap-v2:0.0.1
    ports:
      - "${APP_PORT:-8506}:${APP_PORT:-8506}"
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=${APP_PORT:-8506}
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./.streamlit:/app/.streamlit
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.6'
          memory: 1G

volumes:
  uploads:
  outputs: